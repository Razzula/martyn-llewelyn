[package]
name = "tauri-plugin-android-keystore"
version = "0.1.0"
edition = "2021"
authors = ["Razzula"]
description = "Minimal Tauri plugin to access Android Keystore"
license = "MIT"
rust-version = "1.77.2"
links = "tauri-plugin-android-keystore"

[lib]
name = "tauri_plugin_android_keystore"
src = "src/lib.rs"

[dependencies]
tauri = { version = "2.7.0", features = [] }
tauri-plugin = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.0", features = ["build"] }
