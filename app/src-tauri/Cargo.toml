[package]
name = "master-bagel"
version = "0.1.0"
description = "A Tauri App"
authors = ["Razzula"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }
dotenv-build = "0.1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.0", features = ["devtools"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
rand = "0.9.2"
hex = "0.4"
aes-gcm = "0.10"
tokio = { version = "1.38", features = ["rt", "sync"] }
tauri-plugin-os = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
# not Android
tauri-plugin-keyring = "0.1.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3.0"
tauri-plugin-android-keystore = { path = "../src-tauri-plugin-android-keystore" }
